description: Ball Ranks serves a read-only remote Model Context Protocol server (Streamable HTTP) on its
  own host. A GET answers 405 by design; an anonymous POST initialize and tools/list answer 200 with four
  tools, each annotated read-only, non-destructive and idempotent.
servers:
- name: ball-ranks-public-api
  url: https://ballranks.com/api/mcp
  transport: streamable-http
  auth: none
  anonymous_probe:
    request: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    accept: application/json, text/event-stream
    http_status: 200
  humanURL: https://ballranks.com/developers#mcp
tools:
- name: get_week_rankings
  description: Return published weekly fantasy football rankings for one position, week, and scoring format.
    Use this for start/sit comparisons or a ranked position list. This tool does not support basketball.
  title: Get weekly football rankings
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
- name: get_season_rankings
  description: Return a paginated Ball Ranks season ranking board for fantasy basketball or football.
    Basketball uses nine-category per-game rankings; football accepts standard, half-PPR, or PPR scoring.
  title: Get season rankings
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
- name: get_player_rankings
  description: Look up one player's published Ball Ranks season ranking by player ID or slug. Use this
    when the user asks where a specific player ranks.
  title: Get a player's season ranking
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
- name: get_player_projections
  description: Look up one player's published season projection, or a weekly football projection, by player
    ID or slug. Weekly projections require scope=weekly and a week number.
  title: Get a player's projection
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true

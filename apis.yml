name: Ball Ranks
image: https://ballranks.com/football/ranks/opengraph-image
description: Ball Ranks provides AI‑driven fantasy sports rankings and projections for football and basketball. The 2026 platform offers free
  basic rankings and a Premium tier with deeper models, player histories, and a BallChat AI assistant. It serves data via a versioned REST API
  and a read‑only MCP server, supporting API keys for higher limits. The service is aimed at adult fantasy sports participants and explicitly
  excludes wagering.
